<meta name="apple-mobile-web-app-title" content="Боль">
<title>Дневник головной боли</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mut:#6d6d68;--line:#dcdcd6;--empty:#ecece7;
--r:#e5484d;--o:#f5902b;--y:#f2c230;--g:#3fb56b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#202020;--tx:#eee;--mut:#9a9a94;--line:#363636;--empty:#2b2b2b}}
:root[data-theme="dark"]{--bg:#161616;--card:#202020;--tx:#eee;--mut:#9a9a94;--line:#363636;--empty:#2b2b2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:17px;text-transform:capitalize}
button{font:inherit;color:inherit;background:var(--empty);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:12px;color:var(--mut);text-align:center}
.d{aspect-ratio:1;border-radius:10px;border:0;padding:0;background:var(--empty);font-size:14px;color:var(--mut);position:relative;display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px}
.d.r{background:var(--r);color:#fff}.d.o{background:var(--o);color:#fff}.d.y{background:var(--y);color:#3a2f00}.d.g{background:var(--g);color:#fff}
.d.today{outline:2px solid var(--tx);outline-offset:1px}
.d:disabled{opacity:.35;cursor:default}
.d.n::after{content:"";position:absolute;right:6px;bottom:6px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{font-size:18px;margin:0 0 12px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.lv button{padding:12px 8px;border:2px solid transparent;color:#fff;font-weight:600}
.lv button[data-l=r]{background:var(--r)}.lv button[data-l=o]{background:var(--o)}
.lv button[data-l=y]{background:var(--y);color:#3a2f00}.lv button[data-l=g]{background:var(--g)}
.lv button.sel{border-color:var(--tx);box-shadow:0 0 0 2px var(--card) inset}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
textarea,input[type=text],input[type=time],select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;margin-top:14px}.row .pri{flex:1}
.small{font-size:12px;color:var(--mut);margin:8px 0 0}
.sc{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.sc button{padding:9px 0;font-size:14px;border-radius:8px;text-align:center}
.sc button.sel,.tg button.sel{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{padding:7px 12px;border-radius:999px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:flex;align-items:center;gap:12px}
.st b{min-width:28px;text-align:center;font-size:20px}
.st button{width:44px;font-size:20px;padding:6px 0}
.sum{font-size:14px;color:var(--mut)}
.sum b{color:var(--tx)}
.d .s{position:absolute;left:6px;bottom:4px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Дневник головной боли</h1>

<div class="card">
  <div class="nav"><button id="prev" aria-label="Предыдущий месяц">←</button><b id="mt"></b><button id="next" aria-label="Следующий месяц">→</button></div>
  <div class="grid" id="wd"></div>
  <div class="grid" id="g" style="margin-top:6px"></div>
</div>

<div class="card sum" id="sm"></div>

<div class="card">
  <div class="leg" id="leg"></div>
  <p class="small">Цифра в углу — сила боли, точка — есть подробности. Нажми на квадрат, чтобы отметить день.</p>
</div>

<div class="tools">
  <button id="exp" class="pri">Текст для врача</button>
  <button id="bk">Копия данных</button>
</div>
<p class="small">Данные хранятся только в этом браузере на этом устройстве. Если очистишь данные сайта — записи пропадут, поэтому иногда копируй «Текст для врача» в заметки.</p>
</main>

<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>

<script>
var KEY="headache-diary-v1",LV={r:"Сильная боль",o:"Умеренная боль",y:"Фоновая боль",g:"Боли нет"};
var TAGS=["Плохой сон","Стресс","Пропуск еды","Мало воды","Экран","Погода","Кофе","Тошнота","Светобоязнь","Аура"];
var DUR=["","до 1 ч","1–3 ч","3–6 ч","6–12 ч","весь день"];
var mem={},store=null;
try{store=window.localStorage}catch(e){}
function load(){try{var s=store&&store.getItem(KEY);return s?JSON.parse(s):{}}catch(e){return mem}}
function save(){try{store.setItem(KEY,JSON.stringify(data))}catch(e){mem=data}}
var data=load();
var now=new Date(),vy=now.getFullYear(),vm=now.getMonth();
function pad(n){return String(n).padStart(2,"0")}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
var todayK=key(now.getFullYear(),now.getMonth(),now.getDate());
function $(i){return document.getElementById(i)}
function fmt(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"long"})}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function copy(el,btn,txt){el.select();try{navigator.clipboard.writeText(txt).then(function(){btn.textContent="Скопировано"},function(){document.execCommand("copy")})}catch(e){try{document.execCommand("copy")}catch(_){}}}

["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function(w){var e=document.createElement("div");e.className="wd";e.textContent=w;$("wd").appendChild(e)});

function stats(pre){
  var c={r:0,o:0,y:0,g:0},pills=0,tg={};
  Object.keys(data).forEach(function(k){
    if(pre&&k.indexOf(pre)!==0)return;
    var e=data[k];if(e.l)c[e.l]++;pills+=e.pl||0;
    (e.tg||[]).forEach(function(t){tg[t]=(tg[t]||0)+1});
  });
  var top=Object.keys(tg).sort(function(a,b){return tg[b]-tg[a]}).slice(0,5).map(function(t){return t+" ("+tg[t]+")"});
  return {c:c,p:c.r+c.o+c.y,pills:pills,top:top};
}

function render(){
  var first=new Date(vy,vm,1),n=new Date(vy,vm+1,0).getDate(),off=(first.getDay()+6)%7,g=$("g"),st=stats(vy+"-"+pad(vm+1)+"-");
  $("mt").textContent=first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  g.innerHTML="";
  for(var i=0;i<off;i++)g.appendChild(document.createElement("div"));
  for(var d=1;d<=n;d++){
    var k=key(vy,vm,d),e=data[k],b=document.createElement("button");
    var more=e&&(e.note||e.med||e.t||e.du||e.pl||(e.tg&&e.tg.length));
    b.className="d"+(e&&e.l?" "+e.l:"")+(more?" n":"")+(k===todayK?" today":"");
    b.innerHTML=d+(e&&e.s?'<span class="s">'+e.s+'</span>':'');
    b.setAttribute("aria-label",fmt(k)+(e&&e.l?": "+LV[e.l]:""));
    if(k>todayK)b.disabled=true;
    b.onclick=(function(k){return function(){openDay(k)}})(k);
    g.appendChild(b);
  }
  $("leg").innerHTML=["r","o","y","g"].map(function(l){return '<span><i style="background:var(--'+l+')"></i>'+LV[l]+": "+st.c[l]+"</span>"}).join("");
  $("sm").innerHTML="<b>За месяц:</b> дней с болью <b>"+st.p+"</b>, из них сильных <b>"+st.c.r+"</b>, таблеток <b>"+st.pills+"</b>"+(st.top.length?"<br>Частые факторы: "+esc(st.top.join(", ")):"");
}
$("prev").onclick=function(){vm--;if(vm<0){vm=11;vy--}render()};
$("next").onclick=function(){vm++;if(vm>11){vm=0;vy++}render()};

function openDay(k){
  var e=data[k]||{},sel=e.l||"",sc=e.s||0,pl=e.pl||0,tg=(e.tg||[]).slice(),i,h;
  h='<h2>'+fmt(k)+'</h2><div class="lv">'+["r","o","y","g"].map(function(l){return '<button data-l="'+l+'" class="'+(l===sel?"sel":"")+'">'+LV[l]+'</button>'}).join("")+'</div>';
  h+='<label>Сила боли, 1–10 (по желанию)</label><div class="sc" id="sc">';
  for(i=1;i<=10;i++)h+='<button data-s="'+i+'" class="'+(i===sc?"sel":"")+'">'+i+'</button>';
  h+='</div><div class="two"><div><label for="t">Началась в</label><input type="time" id="t" value="'+esc(e.t)+'"></div><div><label for="du">Длилась</label><select id="du">'+DUR.map(function(x){return '<option value="'+x+'"'+(x===e.du?" selected":"")+'>'+(x||"—")+'</option>'}).join("")+'</select></div></div>';
  h+='<label>Что было (нажми, что подходит)</label><div class="tg" id="tg">'+TAGS.map(function(t){return '<button data-t="'+t+'" class="'+(tg.indexOf(t)>-1?"sel":"")+'">'+t+'</button>'}).join("")+'</div>';
  h+='<label>Таблеток обезболивающего за день</label><div class="st"><button id="mn">−</button><b id="pc">'+pl+'</b><button id="pp">+</button></div>';
  h+='<label for="med">Название лекарства</label><input type="text" id="med" value="'+esc(e.med)+'">';
  h+='<label for="nt">Заметка (необязательно)</label><textarea id="nt">'+esc(e.note)+'</textarea>';
  h+='<div class="row"><button id="del">Очистить</button><button id="cl">Отмена</button><button id="sv" class="pri">Сохранить</button></div>';
  $("sh").innerHTML=h;$("ov").classList.add("on");
  var lb=$("sh").querySelectorAll(".lv button");
  lb.forEach(function(b){b.onclick=function(){sel=b.dataset.l;lb.forEach(function(x){x.classList.toggle("sel",x===b)})}});
  var sb=$("sc").querySelectorAll("button");
  sb.forEach(function(b){b.onclick=function(){var v=+b.dataset.s;sc=(sc===v)?0:v;sb.forEach(function(x){x.classList.toggle("sel",+x.dataset.s===sc)})}});
  $("tg").querySelectorAll("button").forEach(function(b){b.onclick=function(){var t=b.dataset.t,j=tg.indexOf(t);if(j>-1)tg.splice(j,1);else tg.push(t);b.classList.toggle("sel",j===-1)}});
  $("mn").onclick=function(){if(pl>0)pl--;$("pc").textContent=pl};
  $("pp").onclick=function(){if(pl<30)pl++;$("pc").textContent=pl};
  $("cl").onclick=close;
  $("del").onclick=function(){delete data[k];save();close();render()};
  $("sv").onclick=function(){
    var o={l:sel,s:sc,t:$("t").value,du:$("du").value,tg:tg,pl:pl,med:$("med").value.trim(),note:$("nt").value.trim()};
    if(!o.l&&!o.s&&!o.t&&!o.du&&!o.tg.length&&!o.pl&&!o.med&&!o.note)delete data[k];else data[k]=o;
    save();close();render();
  };
}
function close(){$("ov").classList.remove("on")}
$("ov").onclick=function(ev){if(ev.target===$("ov"))close()};

$("exp").onclick=function(){
  var ks=Object.keys(data).sort(),st=stats(""),out=["Дневник головной боли",""];
  if(!ks.length)out.push("Записей пока нет.");
  else{
    out.push("Итого: дней с болью "+st.p+" (сильная "+st.c.r+", умеренная "+st.c.o+", фоновая "+st.c.y+"), без боли "+st.c.g+". Таблеток обезболивающего: "+st.pills+"."+(st.top.length?" Частые факторы: "+st.top.join(", ")+".":""),"");
    ks.forEach(function(k){
      var e=data[k],p=k.split("-"),a=[];
      a.push((e.l?LV[e.l]:"уровень не указан")+(e.s?" "+e.s+"/10":""));
      if(e.t)a.push("с "+e.t);
      if(e.du)a.push("длилась "+e.du);
      if(e.pl||e.med)a.push("таблеток: "+(e.pl||0)+(e.med?" ("+e.med+")":""));
      if(e.tg&&e.tg.length)a.push("факторы: "+e.tg.join(", "));
      out.push(p[2]+"."+p[1]+"."+p[0]+" — "+a.join("; ")+(e.note?"\n  "+e.note:""));
    });
  }
  var txt=out.join("\n");
  $("sh").innerHTML='<h2>Текст для врача</h2><textarea id="tx" style="min-height:300px" readonly>'+esc(txt)+'</textarea><div class="row"><button id="cl">Закрыть</button><button id="cp" class="pri">Скопировать</button></div>';
  $("ov").classList.add("on");
  $("cl").onclick=close;
  $("cp").onclick=function(){copy($("tx"),$("cp"),txt)};
};

$("bk").onclick=function(){
  var js=JSON.stringify(data);
  $("sh").innerHTML='<h2>Копия данных</h2><label>Скопируй этот текст и сохрани в заметки</label><textarea id="js" style="min-height:90px" readonly>'+esc(js)+'</textarea><div class="row"><button id="cp" class="pri">Скопировать</button></div><label for="rs">Восстановить: вставь сюда сохранённую копию</label><textarea id="rs" style="min-height:90px"></textarea><p class="small" id="msg">Восстановление добавит записи к текущим, а совпадающие дни заменит.</p><div class="row"><button id="cl">Закрыть</button><button id="ri" class="pri">Восстановить</button></div>';
  $("ov").classList.add("on");
  $("cl").onclick=close;
  $("cp").onclick=function(){copy($("js"),$("cp"),js)};
  $("ri").onclick=function(){
    try{
      var o=JSON.parse($("rs").value);
      if(!o||typeof o!=="object"||Array.isArray(o))throw 0;
      var c=0;Object.keys(o).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&o[k]&&typeof o[k]==="object"){data[k]=o[k];c++}});
      save();render();$("msg").textContent="Готово, восстановлено дней: "+c;
    }catch(e){$("msg").textContent="Не получилось: текст копии вставлен не полностью."}
  };
};
render();
</script>
</body>
</html>
